<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دفتر البنزين والأجرة</title>
<style>
:root{
  --bg:#eef1f3; --surface:#ffffff; --ink:#17262b; --muted:#5d6e74; --line:#d5dde0;
  --fuel:#b86e08; --income:#0f6b5c; --accent:#0f6b5c; --accent-ink:#ffffff; --danger:#b3261e;
  --fuel-soft:#f6e3c4; --income-soft:#cfe8e1;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14201f; --surface:#1c2b2a; --ink:#e8efee; --muted:#9bb0ad; --line:#2d4140;
    --fuel:#e8a33d; --income:#4fc3a8; --accent:#4fc3a8; --accent-ink:#0b1f1b; --danger:#ff8a80;
    --fuel-soft:#4a3818; --income-soft:#1f4a42;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6;font-size:16px}
main{max-width:560px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:1.25rem;margin:4px 0 14px;font-weight:700}
h2{font-size:1rem;margin:0 0 10px;font-weight:700}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

/* month bar */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthbar button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.2rem;cursor:pointer}
.monthbar strong{font-size:1.05rem}

/* summary */
.split{height:22px;border-radius:11px;overflow:hidden;display:flex;background:var(--income-soft);margin:6px 0 10px}
.split i{display:block;background:var(--fuel);height:100%;transition:width .3s}
.legend{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.legend b{color:var(--ink)}
.net{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.net .big{font-size:1.9rem;font-weight:800;color:var(--income)}
.net .big.neg{color:var(--danger)}
.row2{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-top:6px}
.reserve{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.9rem;color:var(--muted)}
.reserve input{width:64px}

/* form */
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
input[type=date],input[type=number]{width:100%;min-height:46px;padding:8px 10px;font-size:1.05rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
.off{display:flex;align-items:center;gap:10px;min-height:46px;color:var(--ink);font-size:1rem;margin:0}
.off input{width:22px;height:22px}
.actions{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;min-height:48px;border-radius:10px;border:0;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--danger);flex:0 0 auto;padding:0 16px}
.hint{font-size:.85rem;color:var(--muted);margin-top:8px;min-height:1.3em}

/* tables & list */
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{font-weight:600;color:var(--muted);text-align:start;padding:4px 0;font-size:.85rem}
td{padding:7px 0;border-top:1px solid var(--line)}
td.r,th.r{text-align:end}
.pos{color:var(--income)} .neg{color:var(--danger)}
.wk{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.wk.head{border-top:0;padding-top:0;color:var(--muted);font-size:.85rem;font-weight:600}
.wk > span:not(:first-child){text-align:center}
.pos{color:var(--income)} .neg{color:var(--danger)}
.list{list-style:none;margin:0;padding:0}
.list li button{width:100%;text-align:start;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;color:var(--ink);cursor:pointer;font-family:inherit;font-size:1rem;display:flex;justify-content:space-between;gap:10px;align-items:center}
.list li:first-child button{border-top:0}
.list .d{font-weight:600}
.list .m{color:var(--muted);font-size:.88rem}
.tag{font-size:.8rem;padding:2px 8px;border-radius:20px;background:var(--fuel-soft);color:var(--fuel)}
.empty{color:var(--muted);text-align:center;padding:12px 0}
@media (prefers-reduced-motion:reduce){.split i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>دفتر البنزين والأجرة</h1>

  <div class="monthbar">
    <button id="next" aria-label="الشهر التالي">›</button>
    <strong id="monthLabel"></strong>
    <button id="prev" aria-label="الشهر السابق">‹</button>
  </div>

  <section id="summary" aria-live="polite"></section>

  <section>
    <h2 id="formTitle">تسجيل يوم</h2>
    <div class="grid">
      <div class="full">
        <label for="date">التاريخ</label>
        <input type="date" id="date">
      </div>
      <div class="full">
        <label class="off"><input type="checkbox" id="off"> يوم إجازة (بدون دوام)</label>
      </div>
      <div>
        <label for="am">أجرة الصباح ₪</label>
        <input type="number" id="am" inputmode="decimal" min="0" placeholder="0">
      </div>
      <div>
        <label for="pm">أجرة المساء ₪</label>
        <input type="number" id="pm" inputmode="decimal" min="0" placeholder="0">
      </div>
      <div class="full">
        <label for="fuel">تعبئة بنزين في هذا اليوم ₪ (اتركه فارغاً إن لم تعبّئ)</label>
        <input type="number" id="fuel" inputmode="decimal" min="0" placeholder="0">
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="save">حفظ</button>
      <button class="btn ghost" id="del" hidden>حذف</button>
    </div>
    <div class="hint" id="hint"></div>
  </section>

  <section>
    <h2>الأسابيع</h2>
    <div id="weeks"></div>
  </section>

  <section>
    <h2>الأيام المسجلة</h2>
    <ul class="list" id="list"></ul>
  </section>
  <section>
    <h2>نسخة احتياطية</h2>
    <p class="hint" style="margin-top:0">احفظ نسخة بعد كل أسبوع تقريباً وارفعها إلى OneDrive. تحمي بياناتك إذا مُسحت بيانات المتصفح.</p>
    <div class="actions">
      <button class="btn primary" id="export">حفظ نسخة احتياطية</button>
      <button class="btn primary" id="import" style="background:transparent;color:var(--accent);border:1px solid var(--accent)">استرجاع من ملف</button>
    </div>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </section>
</main>

<script>
const KEY = 'fuel-fare-v1';
const DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];

let store = { entries: {}, reserve: 10 };
let month = ymd(new Date()).slice(0,7);

function ymd(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function n(v){ const x=parseFloat(v); return isFinite(x)?x:0; }
function fmt(v){ return Math.round(v).toLocaleString('en-US'); }
function short(s){ const d=parse(s); return d.getDate()+'/'+(d.getMonth()+1); }

function seed(){
  // بيانات تشرين الأول 2026 من الملاحظة
  const rows = [
    [4,100,30,45],[5,0,45,30],[6,250,45,60],[7,0,30,15],[8,0,30,45],[9,0,0,0,1],
    [11,0,60,0],[12,200,45,60],[13,0,45,45],[14,0,30,45],[15,0,0,0,1],
    [17,250,0,0],[18,0,68,34],[19,0,51,68],[20,0,34,34],[21,0,34,68],[22,0,0,0,1],
    [25,250,80,68],[26,0,51,68],[27,0,0,0,1],[28,0,67,0]
  ];
  const e = {};
  rows.forEach(r=>{ const k='2026-10-'+String(r[0]).padStart(2,'0'); e[k]={fuel:r[1],am:r[2],pm:r[3],off:!!r[4]}; });
  return e;
}

let memoryOnly = false;
async function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ memoryOnly = true; setHint('تعذّر الحفظ على هذا المتصفح. افتح الملف من متصفح Chrome أو استضفه على رابط.'); }
}
async function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if(raw){ store = JSON.parse(raw); return; }
  } catch(e){ memoryOnly = true; }
  store = { entries: seed(), reserve: 10 };
  await persist();
}

const $ = id => document.getElementById(id);
function setHint(t){ $('hint').textContent = t || ''; }

function monthEntries(){
  return Object.keys(store.entries).filter(k=>k.startsWith(month)).sort();
}

function renderSummary(){
  const keys = monthEntries();
  let inc=0, fuel=0;
  keys.forEach(k=>{ const e=store.entries[k]; inc+=n(e.am)+n(e.pm); fuel+=n(e.fuel); });
  const net = inc - fuel;
  const share = inc>0 ? fuel/inc*100 : 0;
  const reserveAmt = inc * (n(store.reserve)/100);
  const afterReserve = net - reserveAmt;
  const width = Math.min(100, share);
  $('summary').innerHTML = `
    <div class="legend"><span>بنزين <b class="num">${fmt(fuel)}</b> ₪</span><span>إيرادات <b class="num">${fmt(inc)}</b> ₪</span></div>
    <div class="split" role="img" aria-label="البنزين ${Math.round(share)}% من الإيرادات"><i style="width:${width}%"></i></div>
    <div class="legend"><span>البنزين يأخذ <b class="num">${Math.round(share)}%</b> من الدخل</span></div>
    <div class="net"><span>الفائض بعد البنزين</span><span class="big num ${net<0?'neg':''}">${fmt(net)} ₪</span></div>
    <div class="row2"><span>بعد حجز <span class="num">${n(store.reserve)}%</span> للصيانة</span><b class="num ${afterReserve<0?'neg':'pos'}">${fmt(afterReserve)} ₪</b></div>
    <div class="reserve"><label for="reserve" style="margin:0">نسبة الصيانة %</label><input type="number" id="reserve" inputmode="decimal" min="0" max="100" value="${n(store.reserve)}"></div>
  `;
  $('reserve').addEventListener('change', e=>{ store.reserve = n(e.target.value); persist(); renderSummary(); });
}

function weekStart(s){ const d=parse(s); d.setDate(d.getDate()-d.getDay()); return ymd(d); }

function renderWeeks(){
  const keys = monthEntries();
  if(!keys.length){ $('weeks').innerHTML='<div class="empty">لا توجد أيام في هذا الشهر.</div>'; return; }
  const w = {};
  keys.forEach(k=>{
    const e=store.entries[k], s=weekStart(k);
    w[s] = w[s] || {inc:0,fuel:0};
    w[s].inc += n(e.am)+n(e.pm); w[s].fuel += n(e.fuel);
  });
  const rows = Object.keys(w).sort().map(s=>{
    const net = w[s].inc - w[s].fuel;
    return `<div class="wk"><span>من <span class="num">${short(s)}</span></span><span class="num">${fmt(w[s].inc)}</span><span class="num">${fmt(w[s].fuel)}</span><span class="num ${net<0?'neg':'pos'}">${fmt(net)}</span></div>`;
  }).join('');
  $('weeks').innerHTML = `<div class="wk head"><span>الأسبوع</span><span>إيراد</span><span>بنزين</span><span>فائض</span></div>${rows}`;
}

function renderList(){
  const keys = monthEntries().reverse();
  if(!keys.length){ $('list').innerHTML='<li class="empty">لا توجد أيام مسجلة. أضف أول يوم من النموذج أعلاه.</li>'; return; }
  $('list').innerHTML = keys.map(k=>{
    const e=store.entries[k], d=parse(k);
    const inc = n(e.am)+n(e.pm);
    const mid = e.off ? '<span class="m">إجازة</span>'
      : `<span class="m"><span class="num">${n(e.am)}</span> صباحاً + <span class="num">${n(e.pm)}</span> مساءً = <b class="num">${fmt(inc)}</b></span>`;
    const tag = n(e.fuel)>0 ? `<span class="tag">بنزين <span class="num">${fmt(n(e.fuel))}</span></span>` : '';
    return `<li><button data-k="${k}"><span><span class="d">${DAYS[d.getDay()]} <span class="num">${short(k)}</span></span><br>${mid}</span>${tag}</button></li>`;
  }).join('');
  $('list').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    $('date').value = b.dataset.k; fillForm(); window.scrollTo({top:0,behavior:'smooth'});
  }));
}

function renderAll(){
  const [y,m] = month.split('-').map(Number);
  $('monthLabel').textContent = MONTHS[m-1]+' '+y;
  renderSummary(); renderWeeks(); renderList();
}

function fillForm(){
  const k = $('date').value;
  const e = store.entries[k];
  if(e){
    $('off').checked = !!e.off;
    $('am').value = e.am || ''; $('pm').value = e.pm || ''; $('fuel').value = e.fuel || '';
    $('del').hidden = false; $('formTitle').textContent = 'تعديل يوم';
    setHint('هذا اليوم مسجّل. عدّل الأرقام واضغط حفظ.');
  } else {
    $('off').checked = false; $('am').value=''; $('pm').value=''; $('fuel').value='';
    $('del').hidden = true; $('formTitle').textContent = 'تسجيل يوم';
    setHint('');
  }
  toggleOff();
}
function toggleOff(){
  const off = $('off').checked;
  $('am').disabled = off; $('pm').disabled = off;
}

$('date').addEventListener('change', fillForm);
$('off').addEventListener('change', toggleOff);

$('save').addEventListener('click', async ()=>{
  const k = $('date').value;
  if(!k){ setHint('اختر التاريخ أولاً.'); return; }
  const off = $('off').checked;
  store.entries[k] = { off, am: off?0:n($('am').value), pm: off?0:n($('pm').value), fuel: n($('fuel').value) };
  month = k.slice(0,7);
  await persist();
  renderAll(); fillForm();
  setHint('تم حفظ يوم '+short(k)+'.');
});

$('del').addEventListener('click', async ()=>{
  const k = $('date').value;
  if(!store.entries[k]) return;
  delete store.entries[k];
  await persist();
  renderAll(); fillForm();
  setHint('تم حذف يوم '+short(k)+'.');
});

function shiftMonth(delta){
  const [y,m] = month.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  month = ymd(d).slice(0,7);
  renderAll();
}
$('prev').addEventListener('click', ()=>shiftMonth(-1));
$('next').addEventListener('click', ()=>shiftMonth(1));

$('export').addEventListener('click', async ()=>{
  const name = 'fuel-fare-backup-'+ymd(new Date())+'.json';
  const text = JSON.stringify(store,null,1);
  const P = window.Capacitor && window.Capacitor.Plugins;
  if(P && P.Filesystem && P.Share){
    try{
      const w = await P.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});
      await P.Share.share({title:name,url:w.uri,dialogTitle:'احفظ النسخة الاحتياطية'});
      setHint('اختر OneDrive أو أي مكان من قائمة المشاركة.');
      return;
    }catch(e){ if(String(e).toLowerCase().includes('cancel')) return; }
  }
  const blob = new Blob([text],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setHint('تم إنشاء ملف النسخة الاحتياطية.');
});
$('import').addEventListener('click', ()=>$('file').click());
$('file').addEventListener('change', async ev=>{
  const f = ev.target.files[0]; if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    if(!data.entries) throw new Error('bad');
    store = { entries:data.entries, reserve:n(data.reserve) };
    await persist(); renderAll(); fillForm();
    setHint('تم استرجاع البيانات من الملف.');
  }catch(e){ setHint('الملف غير صالح.'); }
  ev.target.value='';
});

(async function init(){
  if(navigator.storage && navigator.storage.persist){ try{ await navigator.storage.persist(); }catch(e){} }

  await load();
  $('date').value = ymd(new Date());
  fillForm(); renderAll();
})();
</script>
</body>
</html>
